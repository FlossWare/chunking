[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chunking"
version = "0.1"
description = "Canonical document-to-chunk capability for FlossWare"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "Apache-2.0"}

[tool.setuptools.packages.find]
include = ["chunking*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
